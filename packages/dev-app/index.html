<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      <head> metadata is templated from a page-scoped `defineData` entry (see
      src/data/head.ts), edited per page in the editor's "Edit page data" window.
      Small landing pages can skip this and just hardcode their <title> here.
    -->
    <title>{{ head.title }}</title>
    <meta name="description" content="{{ head.description }}" />
    <meta property="og:title" content="{{ head.title }}" />
    <meta property="og:description" content="{{ head.description }}" />
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
