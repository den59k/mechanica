name: Publish

# Publishes the packages to npm when a release tag (v<version>) is pushed.
#
# Authentication is npm trusted publishing (OIDC): no token is stored anywhere.
# On npmjs.com each of the three packages (mechanica, mechanica-shared,
# create-mechanica) names this repository and this file as its trusted
# publisher, so renaming or moving the file breaks publishing until those
# settings are updated.
#
# Run it by hand (Actions → Publish → Run workflow) for a rehearsal: the same
# steps with `npm publish --dry-run`, nothing is uploaded.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm exchange the job's OIDC token for publish rights

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REHEARSAL: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # Trusted publishing needs npm 11.5.1+, which Node 24 ships.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check that the tag matches the version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./packages/mechanica/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mechanica $version"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      # Builds, packs the way `bun publish` would (workspace:* rewritten to real
      # versions) and verifies the tarballs. publish.json lists the ones whose
      # version is not on npm yet, in publish order.
      - name: Pack and verify the tarballs
        run: bun scripts/release-check.ts --out "$RUNNER_TEMP/release"

      # npm uploads the packed tarballs as they are, so this never runs
      # `prepublishOnly` and never sees a `workspace:*` range. Run outside the
      # checkout to keep the monorepo's own package.json out of npm's way.
      - name: Publish
        working-directory: ${{ runner.temp }}
        run: |
          npm --version
          jq -r '.[] | [.tarball, .tag] | @tsv' release/publish.json |
            while IFS=$'\t' read -r tarball tag; do
              if [ "$REHEARSAL" = true ]; then
                npm publish "$tarball" --tag "$tag" --access public --dry-run
              else
                npm publish "$tarball" --tag "$tag" --access public
              fi
            done

      # The check 2.0.0 never got: install what was just published the way a
      # new user would, and build a site with it.
      - name: Verify from the registry
        if: github.event_name == 'push'
        working-directory: ${{ runner.temp }}
        run: |
          jq -r '.[] | "\(.name)@\(.version)"' release/publish.json |
            while read -r spec; do
              for attempt in $(seq 1 30); do
                [ -n "$(npm view "$spec" version 2>/dev/null)" ] && continue 2
                sleep 10
              done
              echo "::error::$spec did not appear on the registry"
              exit 1
            done
          npm create --yes mechanica@latest site
          cd site
          npm install
          npm ls mechanica mechanica-shared
          npm run typecheck
          npm run export
          test -f export/index.html
